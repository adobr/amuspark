<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distribution — Doors</title>
<style>
:root{
  --bg:#F4EBE2;
  --paper:#FBF7F3;
  --olive:#7D7954;
  --olive-dark:#5F5C3F;
  --teal:#436A67;
  --mustard:#D09D4C;
  --terracotta:#BA5636;
  --coral:#D47E5D;
  --brown:#815236;
  --dark:#2B2823;
  --slot:#E8D7C3;
  --line:#B9A48F;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#F7F2EB;font-family:Arial,sans-serif;color:var(--dark)}
body{min-height:100vh;margin:0;overflow:hidden;display:grid;place-items:center;background:#F7F2EB}
.scene-bg{position:fixed;inset:0;background:url('assets/background.png') center/cover no-repeat;z-index:0;opacity:1;transition:opacity 2s ease;pointer-events:none}
.scene-bg.final-fade{opacity:0}
.game{
  width:90vw;
  height:90vh;
  position:relative;
  overflow:hidden;
  background:transparent;
  z-index:1;
}
.canopy{display:none}
.bush{display:none}
.bush.left{display:none}.bush.right{display:none}
.path{display:none}
.magic-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.game{transition:opacity 2s ease}
.game.final-fade{opacity:0}

.doors{
  position:absolute;
  left:19%; right:19%; top:24%;
  height:48%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.6%;
  align-items:end;
}
.door-wrap{
  position:relative;
  height:100%;
  display:flex;
  align-items:end;
  justify-content:center;
  transform:scale(1.5);
  transform-origin:center bottom;
}
.door-wrap::after{content:"";position:absolute;inset:0;background:url('assets/door-frame.png') center bottom/contain no-repeat;pointer-events:none;z-index:3}
.vines{display:none;display:none}
.door{
  position:relative;
  width:83.64%;
  height:auto;
  aspect-ratio:1122 / 1402;
  margin-bottom:10%;
  border:0;
  border-radius:48% 48% 7% 7% / 25% 25% 4% 4%;
  background:transparent url('assets/door-panel.png') center bottom/contain no-repeat;
  box-shadow:none;
  cursor:pointer;
  transform-origin:16% 55%;
  transition:transform .6s ease, filter .2s, box-shadow .2s;
  z-index:2;
}
.door::before{content:none}
.door:hover:not(:disabled){filter:brightness(1.05) drop-shadow(0 0 7px #D09D4C)}
.door:focus-visible{outline:7px solid var(--mustard);outline-offset:7px}
.door.assigned-full{transform:perspective(700px) rotateY(64deg);filter:brightness(1.08);cursor:default}
.door.assigned-partial{transform:perspective(700px) rotateY(19.2deg);filter:brightness(1.05);cursor:default}
.knob{display:none;display:none}

.door > .sign{
  position:absolute;
  left:20%;
  top:19%;
  width:60%;
  height:15%;
  z-index:4;
  display:grid;
  place-items:center;
  pointer-events:none;
}
.door > .sign img{display:block;width:100%;height:100%;object-fit:contain}

.recipient{position:absolute;left:1%;bottom:1%;width:19.2%;height:52.8%;display:flex;align-items:flex-end;justify-content:flex-start;pointer-events:none;z-index:10}
.recipient img{height:100%;width:auto;display:block;object-fit:contain;transform:scaleX(-1);transform-origin:center;filter:drop-shadow(0 4px 6px rgba(0,0,0,.08))}

.people{
  position:absolute;left:31%;right:31%;bottom:1%;height:36.96%;
  pointer-events:none;z-index:10;
}
.person{
  height:100%;width:auto;position:absolute;left:50%;bottom:0;display:flex;align-items:flex-end;justify-content:center;
  transform:translateX(-50%);
  opacity:0;visibility:hidden;transition:transform .5s ease,filter .2s,opacity .5s ease,visibility 0s linear .5s;
}
.person img{width:auto;height:100%;object-fit:contain;object-position:bottom center;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.08))}
.person.visible{opacity:1;visibility:visible;transition:transform .5s ease,opacity .5s ease,visibility 0s linear 0s}
.person.leaving{opacity:0;transform:translateX(-50%) translateY(-6%) scale(.97);filter:none}

@media(max-width:760px){
  .doors{left:11%;right:11%;top:23%;height:46%;gap:.6%}
  .recipient{left:1%;bottom:1%;width:20.4%;height:50.4%}
  .people{left:29%;right:29%;bottom:1%;height:35.28%}
  .person{min-width:56px}
}
</style>
</head>
<body>
<div class="scene-bg" id="sceneBg" aria-hidden="true"></div>
<div class="game" id="game">
  <canvas class="magic-canvas" id="magicCanvas" aria-hidden="true"></canvas>
  <div class="canopy"></div>
  <div class="bush left"></div><div class="bush right"></div><div class="path"></div>

  <div class="recipient" aria-hidden="true">
    <img src="assets/guide.webp" alt="">
  </div>

  <div class="doors" id="doors">
    <div class="door-wrap" data-door="0">
      <div class="vines"></div>
      <button class="door" type="button" aria-label="Bridge">
        <span class="sign"><img src="assets/door-sign-bridge.png" alt=""></span><span class="knob"></span>
      </button>
    </div>
    <div class="door-wrap" data-door="1">
      <div class="vines"></div>
      <button class="door" type="button" aria-label="Trees">
        <span class="sign"><img src="assets/door-sign-trees.png" alt=""></span><span class="knob"></span>
      </button>
    </div>
    <div class="door-wrap" data-door="2">
      <div class="vines"></div>
      <button class="door" type="button" aria-label="Sound">
        <span class="sign"><img src="assets/door-sign-sound.png" alt=""></span><span class="knob"></span>
      </button>
    </div>
  </div>

  <div class="people" aria-hidden="true">
    <div class="person boy" data-person="1"><img src="assets/boy.webp" alt=""></div>
    <div class="person girl" data-person="2"><img src="assets/girl.webp" alt=""></div>
  </div>
</div>

<script>
const game=document.getElementById('game');
const sceneBg=document.getElementById('sceneBg');
const doors=[...document.querySelectorAll('.door')];
const wraps=[...document.querySelectorAll('.door-wrap')];
const boy=document.querySelector('.person.boy');
const girl=document.querySelector('.person.girl');
const canvas=document.getElementById('magicCanvas');
const ctx=canvas.getContext('2d');

const FADE_MS=500;
const BETWEEN_MS=300;
const MAGIC_DUST=['#D09D4C','#E1B86A','#F2D9A3','#F7E6A8'];
const DOOR_DUST=MAGIC_DUST;
const HOVER_DUST=MAGIC_DUST;
const FINAL_FADE_MS=2000;
const GIRL_EXTRA_DELAY_MS=300;

let step=0; // 0 = choose for self, 1 = boy, 2 = girl, 3 = done
let busy=false;
const assigned=[null,null,null];
const lastHoverAt=new WeakMap();

const particles=[];
let particleLoop=false;
let cw=0,ch=0,dpr=1;

function resizeCanvas(){
  const r=game.getBoundingClientRect();
  dpr=Math.max(1,window.devicePixelRatio||1);
  cw=r.width; ch=r.height;
  canvas.width=Math.round(cw*dpr);
  canvas.height=Math.round(ch*dpr);
  canvas.style.width=cw+'px';
  canvas.style.height=ch+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resizeCanvas();
new ResizeObserver(resizeCanvas).observe(game);

function relBox(el){
  const a=el.getBoundingClientRect();
  const g=game.getBoundingClientRect();
  return {x:a.left-g.left,y:a.top-g.top,w:a.width,h:a.height,cx:a.left-g.left+a.width/2,cy:a.top-g.top+a.height/2};
}
function pick(arr){return arr[(Math.random()*arr.length)|0]}
function addParticle(p){particles.push(p)}

function spawnSwirlParticles(el,inward,palette,count=95){
  const b=relBox(el);
  const base=Math.max(38,Math.min(130,Math.max(b.w,b.h)*.38));
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const r=base*(.72+Math.random()*.9);
    const squash=.82;
    const x=b.cx+Math.cos(a)*r;
    const y=b.cy+Math.sin(a)*r*squash;
    const tangent=a+Math.PI/2;
    const radial=inward?-1:1;
    const speed=.45+Math.random()*.75;
    addParticle({
      x,y,
      vx:Math.cos(tangent)*speed+Math.cos(a)*radial*(.22+Math.random()*.45),
      vy:Math.sin(tangent)*speed+Math.sin(a)*radial*(.22+Math.random()*.45),
      life:520+Math.random()*420,
      maxLife:940,
      size:1.2+Math.random()*2.6,
      color:pick(palette),
      alpha:.78+Math.random()*.2,
      swirl:true,inward,
      cx:b.cx,cy:b.cy,
      rot:Math.random()*Math.PI*2,
      vr:(Math.random()-.5)*.08,
      spark:Math.random()>.82
    });
  }
  startParticles();
}

function spawnDisappearanceStars(el,palette,count=115,duration=FADE_MS){
  const b=relBox(el);
  const base=Math.max(38,Math.min(130,Math.max(b.w,b.h)*.38));
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const r=base*(.35+Math.random()*.85);
    const tangent=a+Math.PI/2;
    const life=80+Math.random()*(duration-80);
    addParticle({
      x:b.cx+Math.cos(a)*r,
      y:b.cy+Math.sin(a)*r*.82,
      vx:Math.cos(tangent)*(.35+Math.random()*.7)+Math.cos(a)*(.15+Math.random()*.4),
      vy:Math.sin(tangent)*(.35+Math.random()*.7)+Math.sin(a)*(.15+Math.random()*.4),
      life,
      maxLife:duration,
      size:1.2+Math.random()*2.6,
      color:pick(palette),
      alpha:.78+Math.random()*.2,
      swirl:true,inward:false,
      cx:b.cx,cy:b.cy,
      rot:Math.random()*Math.PI*2,
      vr:(Math.random()-.5)*.08,
      spark:true
    });
  }
  startParticles();
}

function emitSwirl(el,inward,palette,totalCount=95,duration=FADE_MS,trend='grow'){
  let emitted=0;
  const start=performance.now();
  const cumulative=t=> trend==='grow' ? (t*t) : (1-Math.pow(1-t,2));
  return new Promise(resolve=>{
    const frame=now=>{
      const t=Math.min(1,(now-start)/duration);
      const target=Math.round(totalCount*cumulative(t));
      const delta=target-emitted;
      if(delta>0){
        spawnSwirlParticles(el,inward,palette,delta);
        emitted+=delta;
      }
      if(t<1) requestAnimationFrame(frame);
      else resolve();
    };
    requestAnimationFrame(frame);
  });
}

function spawnDoorDust(door,count=42){
  const b=relBox(door);
  for(let i=0;i<count;i++){
    const x=b.x+b.w*(.12+Math.random()*.76);
    const y=b.y+b.h*(.25+Math.random()*.67);
    addParticle({
      x,y,
      vx:(Math.random()-.5)*.45,
      vy:-.45-Math.random()*1.05,
      life:700+Math.random()*650,
      maxLife:1350,
      size:1+Math.random()*2.3,
      color:pick(DOOR_DUST),
      alpha:.52+Math.random()*.28,
      swirl:false,
      rot:Math.random()*Math.PI*2,
      vr:(Math.random()-.5)*.06,
      spark:Math.random()>.88
    });
  }
  startParticles();
}

function drawSpark(p){
  const s=p.size*1.7;
  ctx.beginPath();
  ctx.moveTo(0,-s*2);ctx.lineTo(s*.5,-s*.45);ctx.lineTo(s*2,0);ctx.lineTo(s*.5,s*.45);
  ctx.lineTo(0,s*2);ctx.lineTo(-s*.5,s*.45);ctx.lineTo(-s*2,0);ctx.lineTo(-s*.5,-s*.45);ctx.closePath();ctx.fill();
}
function renderParticles(){
  ctx.clearRect(0,0,cw,ch);
  for(const p of particles){
    const t=Math.max(0,p.life/p.maxLife);
    ctx.save();
    ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    const endFade=Math.min(1,p.life/160);
    ctx.globalAlpha=p.alpha*endFade;
    ctx.shadowBlur=6+p.size*2.5;
    ctx.shadowColor=p.color;
    ctx.fillStyle=p.color;
    if(p.spark) drawSpark(p); else {ctx.beginPath();ctx.arc(0,0,p.size,0,Math.PI*2);ctx.fill()}
    ctx.restore();
  }
}
function startParticles(){
  if(particleLoop)return;
  particleLoop=true;
  let last=performance.now();
  const frame=now=>{
    const dt=Math.min(32,now-last);last=now;
    for(const p of particles){
      p.life-=dt;p.rot+=p.vr*dt/16;
      if(p.swirl){
        const dx=p.x-p.cx,dy=p.y-p.cy,d=Math.max(18,Math.hypot(dx,dy));
        const nx=dx/d,ny=dy/d,tx=-ny,ty=nx;
        const radial=p.inward?-.026:.019;
        p.vx+=tx*.016*dt/16+nx*radial*dt/16;
        p.vy+=ty*.016*dt/16+ny*radial*dt/16;
      }else{
        p.vx*=.992;p.vy*=.997;
      }
      p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;
    }
    for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0)particles.splice(i,1);
    renderParticles();
    if(particles.length)requestAnimationFrame(frame);else{particleLoop=false;ctx.clearRect(0,0,cw,ch)}
  };
  requestAnimationFrame(frame);
}

async function finishScene(){
  requestAnimationFrame(()=>{
    game.classList.add('final-fade');
    sceneBg.classList.add('final-fade');
  });
  await wait(FINAL_FADE_MS);
}

function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function refreshDoors(){
  doors.forEach((door,i)=>{
    const taken=assigned.includes(i);
    door.disabled=busy||taken||step>=3;
    door.classList.toggle('assigned-full',assigned[0]===i);
    door.classList.toggle('assigned-partial',assigned[1]===i||assigned[2]===i);
  });
}
function setActive(person,on){person?.classList.toggle('active',!!on)}

async function showPerson(person){
  if(!person)return;
  person.classList.remove('leaving');
  setActive(person,true);
  person.style.transition='none';
  person.classList.add('visible');
  // Force the visible state immediately, without magic/fade-in.
  person.offsetHeight;
  person.style.transition='';
}
async function hidePerson(person,palette=MAGIC_DUST){
  if(!person)return;
  setActive(person,false);
  spawnDisappearanceStars(person,palette,115,FADE_MS);
  person.classList.add('leaving');
  await wait(FADE_MS);
  person.classList.remove('visible','leaving');
}

function afterDoorOpens(door){
  return new Promise(resolve=>{
    let finished=false;
    const finish=()=>{if(finished)return;finished=true;door.removeEventListener('transitionend',onEnd);resolve()};
    const onEnd=e=>{if(e.propertyName==='transform')finish()};
    door.addEventListener('transitionend',onEnd);
    setTimeout(finish,720);
  });
}

async function handleChoice(door,i){
  if(busy||step>=3||assigned.includes(i))return;
  busy=true;
  const currentStep=step;
  assigned[currentStep]=i;
  refreshDoors();
  spawnDoorDust(door,84);

  // For the children's turns, the door opens while the child disappears.
  // There is no second appearance behind the door.
  const opening=afterDoorOpens(door);
  if(currentStep===1){
    await Promise.all([opening, hidePerson(boy,MAGIC_DUST)]);
  }else if(currentStep===2){
    await Promise.all([opening, hidePerson(girl,MAGIC_DUST)]);
  }else{
    await opening;
  }

  if(currentStep<2){
    await wait(BETWEEN_MS);
    step=currentStep+1;
    if(step===1) await showPerson(boy);
    if(step===2){
      await wait(GIRL_EXTRA_DELAY_MS);
      await showPerson(girl);
    }
  }else{
    step=3;
    await finishScene();
  }
  busy=false;
  refreshDoors();
}

doors.forEach((door,i)=>{
  door.addEventListener('click',()=>handleChoice(door,i));
  door.addEventListener('mouseenter',()=>{
    if(door.disabled) return;
    const now=performance.now();
    const last=lastHoverAt.get(door)||0;
    if(now-last<180) return;
    lastHoverAt.set(door,now);
    spawnDoorDust(door,18);
  });
});
refreshDoors();
</script>
</body>
</html>
