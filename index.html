<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose an Option</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#F4EBE2;font-family:Arial,sans-serif}
nav{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(680px,100%)}
a{display:block;padding:20px 24px;border:2px solid #CCB9A2;border-radius:16px;background:#FBF7F3;color:#2B2823;text-align:center;text-decoration:none;font-size:20px;transition:background .15s,border-color .15s}
a:hover{background:#E5D8C8;border-color:#D09D4C}
a:active{background:#E5D8C8}
a:focus-visible{outline:3px solid #D09D4C;outline-offset:4px}
a.wide{grid-column:1/-1}
@media(max-width:620px){nav{grid-template-columns:1fr}a.wide{grid-column:auto}}
@media(prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
<nav aria-label="Choose an option">
<a href="drag-task.html">Drag and Drop Task</a>
<a href="drag-task-vertical.html">Drag and Drop Task — Vertical</a>
<a href="buttons-task.html">Buttons Task</a>
<a href="buttons_task_vertical.html">Buttons Task — Vertical</a>
<a href="distribution-doors.html">Distribution</a>
</nav>
<script>
let requestNumber=0;
const taskLinks=[...document.querySelectorAll('nav a')].map(link=>({link,path:link.getAttribute('href')}));
function refreshLink(item){
 const url=new URL(item.path,window.location.href);
 url.searchParams.set('v',`${Date.now()}-${++requestNumber}`);
 item.link.href=url.href;
}
taskLinks.forEach(item=>{
 refreshLink(item);
 item.link.addEventListener('click',()=>refreshLink(item));
 item.link.addEventListener('auxclick',()=>refreshLink(item));
});
window.addEventListener('pageshow',()=>taskLinks.forEach(refreshLink));
</script>
</body>
</html>
