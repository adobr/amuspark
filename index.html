<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose an Option</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f7f8fa;font-family:Arial,sans-serif}
nav{display:grid;gap:16px;width:min(320px,100%)}
a{display:block;padding:20px 24px;border:2px solid #ccd5e0;border-radius:16px;background:#fff;color:#38485a;text-align:center;text-decoration:none;font-size:20px;transition:background .15s,border-color .15s}
a:hover{background:#eaf3ff;border-color:#82a7cf}
a:active{background:#dceafa}
a:focus-visible{outline:3px solid #82a7cf;outline-offset:4px}
@media(prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
<nav aria-label="Choose an option">
<a href="drag-task.html">Drag and Drop Task</a>
<a href="buttons-task.html">Buttons Task</a>
<a href="buttons_task_vertical.html">Buttons Task — Vertical</a>
<a href="distribution.html">Distribution</a>
<a href="with-intro.html">Task With Intro</a>
</nav>
<script>
let requestNumber=0;
const taskLinks=[...document.querySelectorAll('nav a')].map(link=>({link,path:link.getAttribute('href')}));
function refreshLink(item){
 const url=new URL(item.path,window.location.href);
 url.searchParams.set('v',`${Date.now()}-${++requestNumber}`);
 item.link.href=url.href;
}
taskLinks.forEach(item=>{
 refreshLink(item);
 item.link.addEventListener('click',()=>refreshLink(item));
 item.link.addEventListener('auxclick',()=>refreshLink(item));
});
window.addEventListener('pageshow',()=>taskLinks.forEach(refreshLink));
</script>
</body>
</html>
