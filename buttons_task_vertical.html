<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buttons Task — Vertical</title>
<style>
:root{--inactive-overlay:rgba(125,121,84,.78);color-scheme:light;font-family:Arial,sans-serif;background:#F4EBE2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:48px 40px}.workspace{width:min(1200px,100%)}.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px}.tray{margin-top:48px}.cell{position:relative;aspect-ratio:1.48;min-width:0;border-radius:20px}.slot{background:#E8D7C3;border:2px solid #B9A48F;transition:background .16s,border-color .16s,box-shadow .16s}.slot.over,.home.over{background:#E8DDD2;border:2px solid #D09D4C;box-shadow:0 0 0 4px rgba(208,157,76,.18)}.slot.filled{border-color:transparent;background:#E8D7C3}.home{border:2px solid transparent}.home.empty{border:2px solid #CCB9A2;background:#EFE3D4}.card{position:absolute;inset:-2px;display:grid;place-items:center;width:calc(100% + 4px);height:calc(100% + 4px);padding:24px;border:2px solid #CCB9A2;border-radius:20px;background:#FBF7F3;box-shadow:0 5px 12px rgba(43,40,35,.10);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .16s,border-color .16s,box-shadow .16s}.card svg{display:block;width:100%;max-height:100%;pointer-events:none}.card:hover{transform:translateY(-4px);border-color:#D09D4C;box-shadow:0 10px 20px rgba(43,40,35,.16)}.card:focus-visible,.cell:focus-visible{outline:3px solid #D09D4C;outline-offset:5px}.slot .card{border-color:#B9A48F;box-shadow:none}.slot .card:hover,.slot .card.selected{box-shadow:none}.card.held{visibility:hidden;transform:none;box-shadow:none}.card.selected{border-color:#D09D4C;outline:6px solid #D09D4C;outline-offset:5px;box-shadow:none}.card.ghost{position:fixed;z-index:100;inset:auto;pointer-events:none;opacity:1;border-color:#D09D4C;box-shadow:0 18px 32px rgba(43,40,35,.16);transform:scale(1.045);transition:none;cursor:grabbing}.dragging,.dragging *{cursor:grabbing!important}.card.settled{animation:settle .22s ease-out}@keyframes settle{0%{transform:scale(1.035)}65%{transform:scale(.985)}100%{transform:scale(1)}}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:700px){body{padding:30px 16px}.row{gap:16px}.tray{margin-top:32px}.cell{aspect-ratio:1}.card{padding:12px;border-radius:14px}.cell{border-radius:14px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.cell.intro{outline:6px solid #D09D4C;outline-offset:5px;transition:background .18s}
.slot.intro{background:#E5D8C8;border-color:#D09D4C}
.home.intro .card{border-color:#D09D4C}
.feedback .card{pointer-events:none;cursor:default}
.workspace.wrong .targets .card{animation:wrong-shake .42s ease-in-out;box-shadow:none}
.workspace.returning .targets .card{z-index:10;animation:return-home .55s cubic-bezier(.22,.65,.3,1) forwards;pointer-events:none}
@keyframes wrong-shake{0%,100%{transform:translateX(0)}15%,45%,75%{transform:translateX(-9px)}30%,60%,90%{transform:translateX(9px)}}
@keyframes return-home{from{transform:translate(0,0)}to{transform:translate(var(--return-x,0px),var(--return-y,0px))}}
@media(prefers-reduced-motion:reduce){.workspace.returning .targets .card{transform:translate(var(--return-x,0px),var(--return-y,0px))}}
.card.picture{padding:0;overflow:hidden}.card.picture svg{width:100%;height:100%;max-height:none}

.card-number{position:absolute;top:12px;left:14px;color:#8D816F;font-size:18px;font-weight:500;pointer-events:none}
.tray{transition:opacity .22s ease,height .35s ease,margin-top .35s ease}
.workspace.success .targets .card{animation:success-snap .36s ease-out;border-color:#7D7954;box-shadow:none;cursor:default}
.workspace.success .card:hover{transform:none;outline:none;box-shadow:none}
.workspace.hide-tray .tray{opacity:0;pointer-events:none}
@keyframes success-snap{0%{transform:scale(1)}40%{transform:scale(.965)}72%{transform:scale(1.018)}100%{transform:scale(1)}}
@media(max-width:700px){.card-number{top:8px;left:10px;font-size:16px}}

body{padding-bottom:120px}
.help-button{position:fixed;right:28px;bottom:24px;z-index:20;display:block;width:76px;height:76px;padding:0;border:3px solid #FBF7F3;border-radius:50%;background:#E8D7C3;box-shadow:0 3px 12px rgba(43,40,35,.16);cursor:pointer;transform-origin:50% 75%;transition:box-shadow .16s,border-color .16s}
.help-portrait{display:block;width:100%;height:100%;border-radius:50%;background-image:var(--portrait);background-size:180%;background-position:61% 20%;pointer-events:none}
.help-badge{position:absolute;right:-3px;top:-4px;display:grid;place-items:center;width:24px;height:24px;border:2px solid #FBF7F3;border-radius:50%;background:#D09D4C;color:#2B2823;font-size:17px;font-weight:700;line-height:1;pointer-events:none}
.help-button:hover{border-color:#EEE3D4;box-shadow:0 5px 15px rgba(43,40,35,.22)}
.help-button:focus-visible{outline:3px solid #D09D4C;outline-offset:5px}
.help-button.speaking{animation:hero-speaking .5s ease-in-out 6;border-color:#E6DCCE}
@keyframes hero-speaking{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@media(max-width:700px){body{padding-bottom:108px}.help-button{right:18px;bottom:18px;width:66px;height:66px}.help-badge{width:22px;height:22px;font-size:16px}}

body.explaining::before{content:"";position:fixed;inset:0;z-index:10;background:var(--inactive-overlay);pointer-events:none}
.workspace.explaining .cell.intro{z-index:11}
.workspace.explaining .card{cursor:default}
.workspace.explaining .card:hover{transform:none;box-shadow:0 5px 12px rgba(43,40,35,.10);border-color:#CCB9A2;outline:none}
.help-button{transition:transform .22s ease,box-shadow .16s,border-color .16s}
.help-button.explaining{transform:scale(1.45);transform-origin:100% 100%;outline:none;box-shadow:none;border-color:#FBF7F3;cursor:default}
.help-button.explaining .help-portrait{animation:hero-speaking 1s ease-in-out infinite}
.help-button.explaining .help-badge{display:none}
.reward-screen{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:24px;background:var(--inactive-overlay)}
.reward-screen[hidden]{display:none}
.reward-frame{position:relative;z-index:2;display:block;padding:0;border:6px solid #D09D4C;border-radius:20px;background:transparent;overflow:hidden;box-shadow:0 16px 60px rgba(43,40,35,.25);cursor:zoom-in;animation:reward-reveal .5s cubic-bezier(.2,.7,.3,1) both}
.reward-frame img{display:block;max-width:78vw;max-height:72vh;width:auto;height:auto;border-radius:12px;object-fit:cover}
.reward-frame:focus-visible{outline:4px solid #D09D4C;outline-offset:5px}
.reward-screen.expanded{padding:12px}
.reward-screen.expanded .reward-frame{width:100%;height:100%;padding:0;border:6px solid #D09D4C;border-radius:16px;background:transparent;overflow:hidden;cursor:zoom-out;animation:none}
.reward-screen.expanded img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
body.rewarded .help-button{visibility:hidden}
.fireworks{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none}
.spark{position:absolute;width:5px;height:14px;border-radius:4px;background:var(--spark-colour);color:var(--spark-colour);box-shadow:0 0 9px currentColor,0 -10px 0 -2px currentColor;opacity:0;animation:firework-burst 1s cubic-bezier(.12,.65,.35,1) var(--delay) both}
.burst-flash{position:absolute;width:22px;height:22px;border:3px solid var(--spark-colour);border-radius:50%;box-shadow:0 0 20px var(--spark-colour);opacity:0;animation:burst-flash .4s ease-out var(--delay) both}
.confetti{position:absolute;top:-8vh;left:var(--left);width:8px;height:15px;border-radius:2px;background:var(--spark-colour);opacity:0;animation:confetti-fall 1.8s ease-in var(--delay) both}
@keyframes burst-flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}12%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(5)}}
@keyframes confetti-fall{0%{opacity:0;transform:translate(0,0) rotate(0deg)}8%,80%{opacity:1}100%{opacity:0;transform:translate(var(--drift),120vh) rotate(var(--spin))}}
@keyframes reward-reveal{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes firework-burst{0%{opacity:0;transform:translate(0,0) rotate(var(--angle)) scale(.2)}8%{opacity:1}60%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--angle)) scale(.35)}}
@media(max-width:700px){.reward-screen{padding:16px}.reward-frame{padding:0;border:5px solid #D09D4C;border-radius:18px}.reward-frame img{max-width:86vw;max-height:78vh;border-radius:10px}.spark{width:4px;height:10px}}
@media(prefers-reduced-motion:reduce){.spark,.burst-flash,.confetti{display:none}}
.reference{width:100%;margin:0 auto 48px;aspect-ratio:2.13;border:2px solid #D8C8B5;border-radius:20px;overflow:hidden;background:#F1E7DB}
.reference svg{position:absolute;inset:0;display:block;width:100%;height:100%}
.answer-button{position:relative;display:grid;place-items:center;aspect-ratio:2.1;padding:24px;border:2px solid #D8C8B5;border-bottom-width:5px;border-radius:18px;background:#F1E7DB;box-shadow:none;cursor:pointer;touch-action:manipulation;transition:background .15s,border-color .15s,transform .12s}
.answer-button svg{display:block;width:100%;max-height:100%;pointer-events:none}
.answer-button:hover{background:#dceafb;border-color:#D09D4C}
.answer-button:active{transform:translateY(2px);border-bottom-width:2px}
.answer-button:focus-visible{outline:3px solid #D09D4C;outline-offset:5px}
.answer-button.picture{padding:0;overflow:hidden}
.answer-button.picture svg{width:100%;height:100%;max-height:none}
.answer-button.intro{outline:6px solid #D09D4C;outline-offset:5px}
.answer-button.correct{border-color:#7D7954;animation:success-snap .36s ease-out;cursor:default}
.answer-button.incorrect{animation:button-shake .65s ease-in-out}
@keyframes button-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.answer-button:disabled{cursor:default}
@media(max-width:700px){.reference{width:100%;aspect-ratio:1.25;margin-bottom:32px;border-radius:14px}.answer-button{aspect-ratio:1.1;padding:12px;border-radius:14px}}

/* Portrait answer buttons, matching the vertical drag variant. */
.workspace{width:min(760px,calc(109svh - 225px),100%)}
.row{gap:32px}
.answer-button{aspect-ratio:3/4;padding:20px}
.answer-button.picture{background:#D09D4C}
.reference{aspect-ratio:2.13;margin-bottom:40px}
@media(max-width:700px){.workspace{width:100%}.row{gap:16px}.answer-button{aspect-ratio:3/4;padding:12px}.reference{aspect-ratio:1.25;margin-bottom:32px}}

/* Keep the complete vertical task on screen, with the same top icons as drag tasks. */
html,body{height:100%;overflow:hidden}
body{height:100vh;height:100dvh;min-height:0;padding:clamp(96px,14vh,124px) clamp(18px,3vw,40px) clamp(16px,2.5vh,28px)!important}
.workspace{width:min(690px,calc((100vh - 175px)*1.02),calc((100dvh - 175px)*1.02),calc(100vw - 48px))!important;max-height:100%;display:flex;flex-direction:column;justify-content:center;min-height:0}
.reference{margin-bottom:clamp(14px,2.7vh,28px)!important;flex:0 1 auto}
.row.answers{gap:clamp(12px,2vw,24px)!important;flex:0 0 auto}
.help-button{top:24px!important;right:28px!important;bottom:auto!important;transform-origin:100% 0!important}
.help-button.explaining{transform-origin:100% 0!important}
.task-level-icon{position:fixed;top:24px;left:28px;z-index:20;display:block;width:160px;height:80px;pointer-events:none}
@media(max-width:700px){body{padding:88px 12px 12px!important}.workspace{width:min(100%,calc((100vh - 108px)*.96),calc((100dvh - 108px)*.96))!important}.reference{margin-bottom:12px!important}.row.answers{gap:9px!important}.help-button{top:14px!important;right:14px!important;width:62px!important;height:62px!important}.task-level-icon{top:14px;left:14px;width:116px;height:58px}.answer-button{padding:8px!important}.reference,.answer-button{border-radius:12px!important}}
@media(max-height:620px){body{padding-top:74px!important}.help-button{top:10px!important;width:54px!important;height:54px!important}.task-level-icon{top:10px;width:104px;height:52px}.workspace{width:min(570px,calc((100dvh - 92px)*.92),calc(100vw - 32px))!important}.reference{margin-bottom:9px!important}}


/* Shared task chrome + reward polish */
.reward-frame{border:6px solid #D09D4C!important;padding:0!important}
.firework-star{position:absolute;left:var(--left);top:var(--top);width:var(--size);height:var(--size);background:#D09D4C;clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 5px rgba(208,157,76,.8));opacity:0;animation:firework-star-pop 1.15s cubic-bezier(.15,.7,.3,1) var(--delay) both}
@keyframes firework-star-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(0deg)}16%,70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25) rotate(130deg)}}
@media(prefers-reduced-motion:reduce){.firework-star{display:none}}

</style>

<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><image id="level-art" width="1671" height="941" href="assets/level-art.png"/></defs></svg>
<svg class="task-level-icon" viewBox="290 35 610 290" role="img" aria-label="Bridge level"><use href="#level-art"/></svg>
<main class="workspace" aria-label="Choose the matching picture">
<div class="reference cell" id="reference" role="img" aria-label="Apple picture"></div>
<div class="row answers" aria-label="Answer choices">
<button class="answer-button cell picture" type="button" aria-pressed="false"></button>
<button class="answer-button cell" type="button" aria-pressed="false"></button>
<button class="answer-button cell" type="button" aria-pressed="false"></button>
</div>
</main>
<div class="sr-only" role="status" aria-live="polite" id="status"></div>
<button type="button" class="help-button" id="help-button" aria-label="Help" aria-pressed="false" style="--portrait:url(assets/help-portrait.png)"><span class="help-portrait"></span><span class="help-badge" aria-hidden="true">?</span></button>
<section class="reward-screen" id="reward-screen" role="dialog" aria-modal="true" aria-label="Your reward" hidden><div class="fireworks" id="fireworks" aria-hidden="true"></div><button type="button" class="reward-frame" id="reward-frame" aria-label="Enlarge reward picture" aria-pressed="false"><img src="assets/reward.png" alt="Pink flamingos standing in turquoise water."></button></section>
<script>

const sleepers = (positions)=>positions.map(([x,y,angle=0])=>`<rect x="${x}" y="${y}" width="22" height="112" rx="2" fill="#9b653d" transform="rotate(${angle} ${x+11} ${y+56})"/>`).join('');
const icons=[
 `<svg viewBox="0 0 320 190" aria-hidden="true">${sleepers([[40,39],[90,39],[140,39],[190,39],[240,39]])}<path d="M20 63H300M20 126H300" fill="none" stroke="#343a3e" stroke-width="14" stroke-linecap="square"/></svg>`,
 `<svg viewBox="0 0 320 190" aria-hidden="true">${sleepers([[46,73,-28],[98,50,-22],[153,31,-16],[210,20,-10],[267,15,-5]])}<path d="M20 114Q150 42 300 42M45 168Q174 103 306 104" fill="none" stroke="#343a3e" stroke-width="14" stroke-linecap="square"/></svg>`,
 `<svg viewBox="0 0 320 190" aria-hidden="true"><g fill="#9b653d"><rect x="28" y="55" width="20" height="90" rx="2"/><rect x="75" y="55" width="20" height="90" rx="2"/><rect x="120" y="50" width="20" height="102" rx="2"/><path d="m165 42 18-9 39 78-18 9Z"/><path d="m212 17 18-9 39 78-18 9Z"/><path d="m171 109 18 9-36 64-18-9Z"/><path d="m217 120 18 9-30 54-18-9Z"/><path d="m266 129 18 9-22 43-18-9Z"/></g><path d="M12 75h113Q161 75 204 51L281 13M12 130h109Q158 130 193 150l83 40M119 75q35 10 75 37l101 46M121 130q33-7 74-32l103-51" fill="none" stroke="#343a3e" stroke-width="12" stroke-linejoin="round"/></svg>`
];
icons[0]=`<svg viewBox="0 0 320 190" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect width="320" height="190" fill="#FFE13B"/><circle cx="270" cy="34" r="18" fill="#FF7B26"/><path d="M0 139h320v51H0Z" fill="#38C8D3"/><path d="M19 162h282" stroke="#263645" stroke-width="6"/><g fill="#FFFFFF"><circle cx="106" cy="32" r="13"/><circle cx="125" cy="24" r="17"/><circle cx="149" cy="22" r="13"/></g><path d="M53 118h171v-15H104V77H70v26H53Z" fill="#EF414D"/><rect x="70" y="67" width="34" height="13" rx="3" fill="#263645"/><rect x="161" y="54" width="64" height="61" rx="5" fill="#3974F1"/><rect x="150" y="43" width="86" height="15" rx="5" fill="#EF414D"/><rect x="174" y="66" width="36" height="30" rx="3" fill="#D7FAFF"/><rect x="229" y="87" width="49" height="39" rx="4" fill="#F0772E"/><path d="M53 113h225v20H53Z" fill="#263645"/><g fill="#263645"><circle cx="86" cy="136" r="18"/><circle cx="137" cy="136" r="18"/><circle cx="193" cy="136" r="18"/><circle cx="257" cy="136" r="14"/></g><g fill="#FFE13B"><circle cx="86" cy="136" r="8"/><circle cx="137" cy="136" r="8"/><circle cx="193" cy="136" r="8"/><circle cx="257" cy="136" r="6"/></g><path d="M86 137h107" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/></svg>`;
const questionPicture=`<svg viewBox="0 0 320 190" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect width="320" height="190" fill="#edf3fa"/><path d="M161 62c-4-12-3-21 4-30" fill="none" stroke="#80634f" stroke-width="7" stroke-linecap="round"/><path d="M164 55c7-25 29-26 43-20-8 20-25 27-43 20Z" fill="#8ca886"/><path d="M159 70c-18-16-52-15-62 11-13 32 6 79 32 80 13 1 20-6 31-6s18 7 31 6c26-1 45-48 32-80-10-26-45-27-64-11Z" fill="#d78273"/></svg>`;
icons[1]=`<svg viewBox="0 0 320 190" aria-hidden="true"><g fill="#56616f"><path d="M116 78a4 4 0 0 1 4-4h18l29-23a3 3 0 0 1 5 2v84a3 3 0 0 1-5 2l-29-23h-18a4 4 0 0 1-4-4Z"/><path d="M187 76a4 4 0 0 1 6-1 29 29 0 0 1 0 40 4 4 0 0 1-6-6 21 21 0 0 0 0-28 4 4 0 0 1 0-5Z"/><path d="M203 62a4 4 0 0 1 6-1 48 48 0 0 1 0 68 4 4 0 0 1-6-6 40 40 0 0 0 0-56 4 4 0 0 1 0-5Z"/></g></svg>`;
const names=['Colourful train picture','Speaker icon','Branching railway piece'];
const workspace=document.querySelector('.workspace');
const reference=document.getElementById('reference');
const choices=[...document.querySelectorAll('.answer-button')];
const status=document.getElementById('status');
let busy=false,explaining=true;
reference.innerHTML=questionPicture;
choices.forEach((button,i)=>{
 button.innerHTML=`<span class="card-number" aria-hidden="true">${i+1}</span>${icons[i]}`;
 button.setAttribute('aria-label',names[i]);
 button.addEventListener('click',()=>{
  if(busy||explaining)return;
  busy=true;
  if(i===0){
   button.classList.add('correct');button.setAttribute('aria-pressed','true');
   choices.forEach(choice=>{choice.disabled=true;});status.textContent='Correct answer.';
   setTimeout(showReward,1300);
  }else{
   button.classList.add('incorrect');status.textContent='Try again.';
   setTimeout(()=>{button.classList.remove('incorrect');busy=false;},750);
  }
 });
});
const helpButton=document.getElementById('help-button');
let helpTimer=null;
helpButton.addEventListener('click',()=>{
 if(explaining)return;
 clearTimeout(helpTimer);
 helpButton.classList.remove('speaking');
 void helpButton.offsetWidth;
 helpButton.classList.add('speaking');
 helpButton.setAttribute('aria-pressed','true');
 helpTimer=setTimeout(()=>{helpButton.classList.remove('speaking');helpButton.setAttribute('aria-pressed','false');helpTimer=null;},3000);
});

const rewardScreen=document.getElementById('reward-screen');
const rewardFrame=document.getElementById('reward-frame');
const fireworks=document.getElementById('fireworks');
let fireworksTimer=null,rewardReturnTimer=null;
rewardFrame.addEventListener('click',()=>{
 const expanded=!rewardScreen.classList.contains('expanded');
 rewardScreen.classList.toggle('expanded',expanded);
 rewardFrame.setAttribute('aria-pressed',String(expanded));
 rewardFrame.setAttribute('aria-label',expanded?'Reduce reward picture':'Enlarge reward picture');
});
function resetAfterReward(){
 clearTimeout(fireworksTimer);clearTimeout(rewardReturnTimer);fireworks.innerHTML='';
 rewardScreen.hidden=true;rewardScreen.classList.remove('expanded');rewardFrame.setAttribute('aria-pressed','false');rewardFrame.setAttribute('aria-label','Enlarge reward picture');
 document.body.classList.remove('rewarded');workspace.inert=false;helpButton.disabled=false;
 choices.forEach(choice=>{choice.disabled=false;choice.classList.remove('correct','incorrect');choice.setAttribute('aria-pressed','false');});
 busy=false;status.textContent='Choose the matching picture.';
}
function showReward(){
 workspace.inert=true;helpButton.disabled=true;document.body.classList.add('rewarded');
 rewardScreen.hidden=false;status.textContent='Your reward is ready.';
 const colours=['#D09D4C','#D09D4C','#D09D4C','#7D7954','#BA5636','#D47E5D','#436A67','#815236'];
 const centres=[[14,22],[86,25],[28,12],[73,85],[12,77],[90,67]];
 const bursts=Array.from({length:18},(_,burst)=>{
  const [x,y]=centres[burst%centres.length],delay=Math.floor(burst/6)*550+(burst%6)*75;
  const colour=colours[burst%colours.length];
  const flash=`<span class="burst-flash" style="left:${x}%;top:${y}%;--delay:${delay}ms;--spark-colour:${colour}"></span>`;
  return flash+Array.from({length:48},(_,i)=>{
   const angle=(i%24)*Math.PI/12+Math.floor(i/24)*.08;
   const reach=(i<24?30:19)+(i%3)*2;
   return `<span class="spark" style="left:${x}%;top:${y}%;--dx:${Math.cos(angle)*reach}vmin;--dy:${Math.sin(angle)*reach+8}vmin;--angle:${angle*180/Math.PI+90}deg;--delay:${delay}ms;--spark-colour:${i%8===0?'#D09D4C':colour}"></span>`;
  }).join('');
 }).join('');
 const confetti=Array.from({length:120},(_,i)=>`<span class="confetti" style="--left:${(i*37)%100}%;--drift:${(i%2?1:-1)*(12+i%18)}vw;--spin:${(i%2?1:-1)*(360+i%5*180)}deg;--delay:${300+i%12*50}ms;--spark-colour:${colours[i%colours.length]}"></span>`).join('');
 const stars=Array.from({length:54},(_,i)=>`<span class="firework-star" style="--left:${7+(i*37)%87}%;--top:${8+(i*53)%82}%;--size:${10+(i%4)*4}px;--delay:${180+(i%14)*85}ms"></span>`).join('');
 fireworks.innerHTML=bursts+confetti+stars;
 rewardFrame.focus({preventScroll:true});
 fireworksTimer=setTimeout(()=>{fireworks.innerHTML='';},2800);
 rewardReturnTimer=setTimeout(resetAfterReward,4800);
 status.textContent='Task completed. Your reward is ready.';
}

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!rewardScreen.hidden){rewardScreen.classList.remove('expanded');rewardFrame.setAttribute('aria-pressed','false');rewardFrame.setAttribute('aria-label','Enlarge reward picture');}
});
workspace.inert=true;workspace.classList.add('explaining');document.body.classList.add('explaining');
helpButton.disabled=true;helpButton.classList.add('explaining');
setTimeout(()=>{reference.classList.add('intro');},350);
setTimeout(()=>{reference.classList.remove('intro');choices[0].classList.add('intro');},1850);
setTimeout(()=>{
 choices[0].classList.remove('intro');workspace.classList.remove('explaining');document.body.classList.remove('explaining');
 explaining=false;workspace.inert=false;helpButton.disabled=false;helpButton.classList.remove('explaining');status.textContent='Choose the matching picture.';
},3350);

</script>
</body>
