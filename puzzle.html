  main { width: 100%; height: 100%; display: grid; place-items: center; }
  svg { display: block; width: 100%; height: 100%; touch-action: manipulation; }
  .guide { fill: none; stroke: var(--line); stroke-width: 3; opacity: .8; }
  .fitted-edge { fill: none; stroke: #6b573e; stroke-width: 3; }
  .active-outline { fill: none; stroke: var(--selection); stroke-width: 11; stroke-linejoin: round; pointer-events: none; }
  .piece[role=button] {
    cursor: pointer; outline: none; transform-box: view-box;
    transition: transform .22s ease;
  }
  .piece[role=button] .active-outline { animation: outline-pulse 1.9s ease-in-out infinite; }
  .piece[role=button]:hover, .piece[role=button]:focus-visible { transform: scale(1.045); }
  @keyframes outline-pulse {
    0%, 100% { stroke-width: 11; stroke: #cda04d; }
    50% { stroke-width: 15; stroke: #e0bc69; }
  }
  .piece[role=button]:focus-visible .active-outline { animation: none; stroke: #f5d48a; stroke-width: 15; }
  .piece[role=button]:hover .active-outline { stroke: #d7ac59; }
  .piece[role=button]:active { opacity: .94; }
  .particles { pointer-events: none; }
  .particle { fill: var(--selection); opacity: 0; animation: float-particle 3s ease-in-out infinite; }
  @keyframes float-particle {
    0% { opacity: 0; transform: translate(0, 5px) scale(.45); }
    25% { opacity: .95; transform: translate(0, -5px) scale(1); }
    75% { opacity: .75; transform: translate(var(--dx), var(--dy)) scale(.75); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2); }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  @media (prefers-reduced-motion: reduce) {
    .piece[role=button] { transition: none; }
    .particle { animation: none; }
    .piece[role=button] .active-outline { animation: none; }
    .piece[role=button]:hover, .piece[role=button]:focus-visible { transform: none; }
  }
</style>

  <svg id="puzzle" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc">
    <title id="title">Картонный пазл</title>
    <desc id="desc">Две детали собраны. Нажмите на выделенную деталь в сепии, чтобы собрать её и перейти к следующей.</desc>
    <defs>
      <pattern id="paper" width="200" height="200" patternUnits="userSpaceOnUse">
        <rect width="200" height="200" fill="#f1e9de"/>
        <rect width="200" height="200" fill="#b69f80" opacity=".07" filter="url(#grain)"/>
      </pattern>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <!-- One inset shadow around the tray, not around individual empty slots. -->
      <filter id="inset" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
        <feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
        <!-- The same 5-unit cardboard depth is used for the rim and the pieces.
             A centred shadow makes every inner wall visible from overhead. -->
        <feMorphology operator="dilate" radius="5"/>
        <feGaussianBlur stdDeviation="2.5"/>
        <feComposite in2="SourceAlpha" operator="in" result="shadowMask"/>
        <feFlood flood-color="#564027" flood-opacity=".58"/>
        <feComposite in2="shadowMask" operator="in" result="shade"/>
        <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
      </filter>
      <filter id="pieceShadow" x="-12%" y="-15%" width="124%" height="130%" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="5"/>
        <feGaussianBlur stdDeviation="2.5" result="depthMask"/>
        <feFlood flood-color="#564027" flood-opacity=".58"/>
        <feComposite in2="depthMask" operator="in"/>
      </filter>
      <filter id="sepia" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values=".30 .59 .11 0 0 .255 .5015 .0935 0 0 .195 .3835 .0715 0 0 0 0 0 1 0"/>
      </filter>

<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const config = { columns: 4, rows: 3, completed: 2, x: 72, y: 88, width: 1456, height: 724 };
  let completed = config.completed;
  const total = config.columns * config.rows;
  const w = config.width / config.columns, h = config.height / config.rows;
  const defs = document.querySelector('defs');
  const pieces = document.getElementById('pieces');
  const pieceDepth = document.getElementById('pieceDepth');
  const guides = document.getElementById('guides');
  const imageHref = document.getElementById('meadow').getAttribute('href');
  function el(tag, attrs = {}) {
    const element = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k,v]) => element.setAttribute(k, v));
    return element;
  }
  // Shared cubic edges guarantee that adjoining jigsaw contours match exactly.
  function edge(a, b, sign = 0) {
    const dx=b[0]-a[0], dy=b[1]-a[1], length=Math.hypot(dx,dy);
    const depth=31*sign;
    const point=(t,n=0) => `${(a[0]+dx*t-dy/length*n).toFixed(2)},${(a[1]+dy*t+dx/length*n).toFixed(2)}`;
    if (!sign) return `L${point(1)}`;
    return `L${point(.39)} C${point(.47)} ${point(.42,depth*.48)} ${point(.42,depth*.74)} C${point(.42,depth*1.35)} ${point(.58,depth*1.35)} ${point(.58,depth*.74)} C${point(.58,depth*.48)} ${point(.53)} ${point(.61)} L${point(1)}`;
  }
  const horizontal = (r,c) => ((r+c)%2 ? 1 : -1);
  const vertical = (r,c) => ((r+c)%2 ? -1 : 1);
  const cells=[];
  for(let r=0;r<config.rows;r++) for(let c=0;c<config.columns;c++) {
    const x=config.x+c*w,y=config.y+r*h;
    const a=[x,y],b=[x+w,y],d=[x,y+h],e=[x+w,y+h];
    // Round the actual silhouette, including the picture and outline, rather than
    // clipping the whole piece layer (which would cut off hover and particles).
    const radius=15;
    const trim=(segment,end)=>segment.replace(/L[-\d.,]+$/,`L${end}`);
    let top=edge(a,b,r?horizontal(r,c):0);
    let right=edge(b,e,c<3?vertical(r,c+1):0);
    let bottom=edge(e,d,r<2?-horizontal(r+1,c):0);
    let left=edge(d,a,c?-vertical(r,c):0);
    if(r===0&&c===3) top=trim(top,[x+w-radius,y])+` Q${b} ${x+w},${y+radius}`;
    if(r===2&&c===3) right=trim(right,[x+w,y+h-radius])+` Q${e} ${x+w-radius},${y+h}`;
    if(r===2&&c===0) bottom=trim(bottom,[x+radius,y+h])+` Q${d} ${x},${y+h-radius}`;
    if(r===0&&c===0) left=trim(left,[x,y+radius])+` Q${a} ${x+radius},${y}`;
    const start=r===0&&c===0?[x+radius,y]:a;
    const path=`M${start} ${top} ${right} ${bottom} ${left} Z`;
    const id=cells.length;
    const clip=el('clipPath',{id:`cell-${id}`}); clip.append(el('path',{d:path})); defs.append(clip);
    cells.push({x,y,path});
  }
  // These paths have no shadow or relief: all empty locations share one floor.
  for(let r=1;r<3;r++) for(let c=0;c<4;c++) {
    const a=[config.x+c*w,config.y+r*h], b=[a[0]+w,a[1]];
    guides.append(el('path',{d:`M${a} ${edge(a,b,horizontal(r,c))}`,class:'guide'}));
  }
  for(let c=1;c<4;c++) for(let r=0;r<3;r++) {
    const a=[config.x+c*w,config.y+r*h],b=[a[0],a[1]+h];
    guides.append(el('path',{d:`M${a} ${edge(a,b,vertical(r,c))}`,class:'guide'}));
  }
  function render(restoreFocus=false) {
    pieces.replaceChildren();
    pieceDepth.replaceChildren();
    cells.forEach((cell,index) => {
      if(index>completed || (index===completed && completed===total)) return;
      const active=index===completed;
      const group=el('g',{class:'piece', 'data-index':index, style:`transform-origin:${cell.x+w/2}px ${cell.y+h/2}px`});
      const shadow=el('path',{d:cell.path,fill:'#f1e9de',filter:'url(#pieceShadow)'});
      pieceDepth.append(shadow);
      // Each piece repeats the supplied picture; the image is clipped in SVG.
      const image=el('image',{
        href:imageHref,x:cell.x-32,y:cell.y-32,width:w+64,height:h+64,
        preserveAspectRatio:'xMidYMid slice','clip-path':`url(#cell-${index})`
      });
      if(active) image.setAttribute('filter','url(#sepia)');
      group.append(image,el('path',{d:cell.path,class:'fitted-edge'}));
      if(active) {
        group.setAttribute('role','button'); group.setAttribute('tabindex','0');
        group.setAttribute('aria-label',`Собрать деталь ${index+1} из ${total}`);
        group.append(el('path',{d:cell.path,class:'active-outline'}));
        group.addEventListener('click',advance);
        group.addEventListener('keydown',event=>{
          if(event.key==='Enter'||event.key===' ') {event.preventDefault();advance();}
        });
      } else {
        group.setAttribute('role','img');
        group.setAttribute('aria-label',`Деталь ${index+1} собрана`);
      }
      pieces.append(group);
      if(active) {
        const outline=group.querySelector('.active-outline');
        const length=outline.getTotalLength();
        const particles=el('g',{class:'particles','aria-hidden':'true'});
        for(let n=0;n<16;n++) {
          const point=outline.getPointAtLength(length*(n+.3)/16);
          const anchor=el('g',{transform:`translate(${point.x} ${point.y})`});
          const size=3.2+(n%3)*.9;
          const particle=el(n%4===0?'path':'circle',n%4===0
            ?{d:`M0 ${-size*1.5} L${size} 0 L0 ${size*1.5} L${-size} 0 Z`}
            :{cx:0,cy:0,r:size});
          particle.setAttribute('class','particle');
          particle.setAttribute('style',`--dx:${(n%2?1:-1)*(10+n%5*3)}px;--dy:${-22-n%4*8}px;animation-delay:${-n*.37}s;animation-duration:${2.6+n%5*.23}s`);
          anchor.append(particle); particles.append(anchor);
        }
        group.append(particles);
      }
    });
    document.getElementById('status').textContent = completed===total ? 'Все 12 деталей собраны.' : `Собрано ${completed} из 12. Активна деталь ${completed+1}.`;
    if(restoreFocus) pieces.querySelector('[role=button]')?.focus();
  }
  function advance() {
    if(completed>=total) return;
    const index=completed;
    completed++;
    render(true);
    document.getElementById('puzzle').dispatchEvent(new CustomEvent('puzzle:complete',{detail:{index,completed,total},bubbles:true}));
  }
  // Integration API: call completeActive() after a child finishes a real task.
  window.puzzle = {
    completeActive: advance,
    reset() { completed=config.completed; render(); },
    setCompleted(count) { if(!Number.isInteger(count)||count<0||count>total) throw new RangeError('Expected an integer from 0 to 12'); completed=count; render(); },
    get completed() { return completed; }
  };
  render();
})();
</script>
</body>
</html>
